<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      displayCartQuantity();
    ">Show Quantity</button>

    <button onclick="
      updateCartQuantity(1)
    ">Add to Cart</button>

    <button onclick="
     updateCartQuantity(2)
    ">+2</button>

    <button onclick="
    updateCartQuantity(3)
    ">+3</button>

    <button onclick="
     updateCartQuantity(4)
    ">+4</button>

    <button onclick="
      updateCartQuantity(5)
    ">+5</button>

    <!-- vvv This code was changed. vvv -->
    <button onclick="
     updateCartQuantity(-1)
    ">Remove from cart</button>

    <button onclick="
      updateCartQuantity(-2)
    ">-2</button>

    <button onclick="
      updateCartQuantity(-3)
    ">-3</button>
    <!-- ^^^ This code was changed. ^^^ -->

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
        displayCartQuantity();
    ">Reset Cart</button>
     
     <p class="js-message"></p>
    <script>
      let cartQuantity = 0;

      function updateCartQuantity(value) {
         if (cartQuantity + value > 10) {
        alert('The cart is full');
        return
      } 
      
      if (cartQuantity + value < 0) {
        alert('Not enough items in cart')
        return;
      }
        cartQuantity = cartQuantity + value;
        displayCartQuantity();
      
      }

      function displayCartQuantity() {
        document.querySelector('.js-message').innerHTML = `Cart quantity: ${cartQuantity}`; 
      }
    </script>
  </body>
</html
