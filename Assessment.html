<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/Assesment.css">
</head>
<body>

    <header class="header">
       <div>
        <h1>Student Score Database</h1>
        <p>Manage student records and scores</p>
        </div>
        
        <button class="add-button" onclick="addStudent()">+ Add Student</button>
    </header>

    <div class="student-list"> 
            <div class="student-card">

                <div class="student-info">
                <h3>Vincent</h3>
                <p>Score: 90</p>
                </div>

                <div class="student-control">
                    <button onclick="increaseScore(${index})">+2</button>
                    <button onclick="decreaseScore(${index})">-2</button>
                    <button>Delete</button>
                </div>
            </div>
        </div>
        
    <script src="Js/Assesment.js"></script>
</body>
</html>
